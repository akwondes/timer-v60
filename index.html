<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a6f97">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Timer V60</title>
<style>
:root{--bg:#e8edef;--sf:#f6f8f9;--ink:#1b2830;--mu:#566872;--ac:#1f5f87;--on:#fff;--ln:#cdd6db;--w:#4f9fcb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--sf:#18242b;--ink:#e6eef2;--mu:#93a6b0;--ac:#6bb6e0;--on:#0a1419;--ln:#2a3a43;--w:#3b86b5}}
:root[data-theme="dark"]{--bg:#10181d;--sf:#18242b;--ink:#e6eef2;--mu:#93a6b0;--ac:#6bb6e0;--on:#0a1419;--ln:#2a3a43;--w:#3b86b5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",ui-rounded,system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:20px;margin:4px 0 10px;letter-spacing:-.01em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.by{color:var(--mu);font-size:13px;margin:6px 0 10px}
.stage{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px}
.time{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.sub{color:var(--mu);font-size:14px;margin-top:6px}
.now{margin:12px 0;padding:14px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);min-height:84px}
.now b{display:block;font-size:19px}
.now span{color:var(--mu);font-size:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.dose{display:flex;align-items:center;gap:10px}
.dose button{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:20px}
.dose output{min-width:64px;text-align:center;font-weight:600}
.meta{font-size:13px;color:var(--mu);text-align:right}
.ctl{display:grid;grid-template-columns:1fr 96px;gap:10px}
.ctl button{height:56px;border-radius:16px;border:0;font:inherit;font-size:18px;font-weight:600}
#go{background:var(--ac);color:var(--on)}
#rs{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
ol{list-style:none;margin:16px 0 0;padding:0}
li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:10px 12px;border-radius:12px;font-size:14px;border:1px solid transparent}
li .t{font-variant-numeric:tabular-nums;color:var(--mu)}
li.on{background:var(--sf);border-color:var(--ac)}
li.done{opacity:.5}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.note{font-size:12px;color:var(--mu);margin-top:14px}
.tg{display:flex;gap:8px;margin-top:12px}
.tg button{flex:1;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-size:13px;padding:9px}
.tg button[aria-pressed=false]{opacity:.55}
[hidden]{display:none!important}
.hm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.mb{text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:14px;border-radius:18px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit}
.mb b{font-size:18px;letter-spacing:-.01em}
.mb span{font-size:12.5px;color:var(--mu);flex:1}
.mb em{font-style:normal;font-size:12.5px;color:var(--ac);font-weight:600}
.mb:active{transform:scale(.98)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top h1{margin:0;font-size:20px}
#back{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<section id="home"><h1>Seduh V60</h1><p class="by">Pilih metode, lalu ikuti timernya.</p><div class="hm" id="hm"></div></section>
<section id="prac" hidden>
<div class="top"><button id="back" aria-label="Kembali ke daftar metode">‹ Metode</button><h1 id="ptitle"></h1></div>
<p class="by" id="by"></p>
<div class="stage">
  <svg viewBox="0 0 200 230" width="150" aria-hidden="true">
    <defs><clipPath id="cone"><path d="M24 24H176L116 196H84Z"/></clipPath></defs>
    <path d="M24 24H176L116 196H84Z" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
    <rect id="wt" x="0" y="196" width="200" height="180" fill="var(--w)" clip-path="url(#cone)"/>
    <rect x="76" y="200" width="48" height="22" rx="6" fill="none" stroke="var(--mu)" stroke-width="4"/>
  </svg>
  <div><div class="time" id="tm">0:00</div><div class="sub" id="sb">Siap</div><div class="sub" id="gr"></div></div>
</div>
<div class="now" id="now"></div>
<div class="row">
  <div class="dose"><button id="dm" aria-label="Kurangi kopi">−</button><output id="dv"></output><button id="dp" aria-label="Tambah kopi">+</button></div>
  <div class="meta" id="mt"></div>
</div>
<div class="ctl"><button id="go">Mulai</button><button id="rs">Reset</button></div>
<div class="tg"><button id="tsn" aria-pressed="true">Bunyi: hidup</button><button id="tvo" aria-pressed="true">Suara pemandu: hidup</button></div>
<ol id="ls"></ol>
<p class="note">Takaran air ikut menyesuaikan jumlah kopi. Angka waktu mengikuti resep yang beredar dari masing-masing barista; sesuaikan gilingan dan suhu dengan biji Anda. Bunyi dan getar menandai tiap tahap.</p>
</section></main>
<script>
// langkah: [detik mulai, air kumulatif (g), judul, catatan, durasi tuang (detik)]
const R=[
{n:'Kasuya 4:6',by:'Tetsu Kasuya, juara World Brewers Cup 2016',dose:20,temp:'93°C',grind:'Kasar',end:210,
 s:[[0,60,'Tuang 1 — 60 g','Dua tuangan awal menentukan rasa: kecil-besar untuk keasaman/manis.',12],
    [45,120,'Tuang 2 — sampai 120 g','Total 40% air untuk rasa.',12],
    [90,180,'Tuang 3 — sampai 180 g','Tiga tuangan akhir menentukan kekuatan.',12],
    [135,240,'Tuang 4 — sampai 240 g','',12],
    [180,300,'Tuang 5 — sampai 300 g','Biarkan menetes habis.',12]]},
{n:'Hoffmann',by:'James Hoffmann, “Ultimate V60”',dose:30,temp:'96–100°C',grind:'Sedang-halus',end:210,
 s:[[0,60,'Bloom 60 g','Basahi semua bubuk, putar dripper.',10],
    [45,300,'Tuang sampai 300 g','Tuang stabil berputar, selesai sekitar 1:15.',30],
    [75,500,'Tuang sampai 500 g','Selesai sekitar 1:45.',30],
    [105,500,'Aduk lembut & putar','Aduk searah jarum jam, lalu putar dripper agar bed rata.',0]]},
{n:'Rao',by:'Scott Rao, satu tuangan (perkiraan)',dose:20,temp:'96°C',grind:'Sedang',end:180,
 s:[[0,60,'Bloom 60 g','Aduk rata sampai semua bubuk basah.',10],
    [30,320,'Tuang pelan sampai 320 g','Aliran stabil dan rendah, jaga permukaan air.',60],
    [90,320,'Putar dripper','Putar lembut agar bed kopi rata, tunggu menetes.',0]]},
{n:'Pulse klasik',by:'Metode umum rasio 1:15',dose:20,temp:'92–94°C',grind:'Sedang',end:180,
 s:[[0,40,'Bloom 40 g','Tunggu 30–40 detik.',8],
    [40,150,'Tuang sampai 150 g','',15],
    [70,250,'Tuang sampai 250 g','',15],
    [100,300,'Tuang sampai 300 g','Biarkan menetes habis.',12]]},
{n:'Kasuya manis',by:'Varian 4:6 Tetsu Kasuya: tuangan awal 50 g lalu 70 g, rasa lebih manis',dose:20,temp:'93°C',grind:'Kasar',end:210,
 s:[[0,50,'Tuang 1 — 50 g','Tuangan awal kecil membuat rasa lebih manis.',12],
    [45,120,'Tuang 2 — sampai 120 g','Total 40% air untuk rasa.',12],
    [90,180,'Tuang 3 — sampai 180 g','Tiga tuangan akhir menentukan kekuatan.',12],
    [135,240,'Tuang 4 — sampai 240 g','',12],
    [180,300,'Tuang 5 — sampai 300 g','Biarkan menetes habis.',12]]},
{n:'Kasuya cerah',by:'Varian 4:6 Tetsu Kasuya: tuangan awal 70 g lalu 50 g, keasaman lebih cerah',dose:20,temp:'93°C',grind:'Kasar',end:210,
 s:[[0,70,'Tuang 1 — 70 g','Tuangan awal besar membuat keasaman lebih cerah.',12],
    [45,120,'Tuang 2 — sampai 120 g','Total 40% air untuk rasa.',12],
    [90,180,'Tuang 3 — sampai 180 g','Tiga tuangan akhir menentukan kekuatan.',12],
    [135,240,'Tuang 4 — sampai 240 g','',12],
    [180,300,'Tuang 5 — sampai 300 g','Biarkan menetes habis.',12]]}];
const $=i=>document.getElementById(i);
let r=R[0],dose=r.dose,run=false,acc=0,t0=0,last=-1,warned=-1,ac=null,lock=null,snd=true,vo=true,cd='';
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const sc=()=>dose/r.dose, W=g=>Math.round(g*sc());
function beep(f,d,dl){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(dl||0),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function say(t){if(!vo)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';speechSynthesis.speak(u)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function build(){
  $('by').textContent=r.by;$('ptitle').textContent=r.n;
  $('mt').textContent=`${W(r.s[r.s.length-1][1])} g air · ${r.temp} · giling ${r.grind.toLowerCase()}`;
  $('dv').textContent=dose+' g';
  $('ls').innerHTML=r.s.map((s,i)=>`<li id="s${i}"><span class="t">${mmss(s[0])}</span><span>${s[2].replace(/\d+ g/g,m=>W(parseInt(m))+' g')}</span><span class="t">${W(s[1])} g</span></li>`).join('');
  draw(acc);
}
function draw(e){
  let i=-1;r.s.forEach((s,k)=>{if(e>=s[0])i=k});
  const done=e>=r.end;
  let w=0;
  if(i>=0){const s=r.s[i],p=i?r.s[i-1][1]:0,d=s[4];w=p+(s[1]-p)*(d?Math.min(1,(e-s[0])/d):1)}
  const tot=r.s[r.s.length-1][1];
  $('wt').setAttribute('y',196-(w/tot)*172);
  $('tm').textContent=mmss(e);
  $('gr').textContent=W(w)+' g air';
  if(done){$('sb').textContent='Selesai';$('now').innerHTML='<b>Selesai, silakan dinikmati.</b><span>Aduk sebentar sebelum menyajikan.</span>'}
  else if(i<0){$('sb').textContent='Siap';$('now').innerHTML='<b>Panaskan air, bilas filter.</b><span>Tekan Mulai lalu langsung tuang tahap pertama.</span>'}
  else{const n=r.s[i+1]?r.s[i+1][0]:r.end;$('sb').textContent=(r.s[i+1]?'Tahap berikut ':'Selesai ')+'dalam '+mmss(Math.max(0,n-e));
    const s=r.s[i];$('now').innerHTML=`<b>${s[2].replace(/\d+ g/g,m=>W(parseInt(m))+' g')}</b><span>${s[3]}</span>`}
  r.s.forEach((_,k)=>{const el=$('s'+k);if(el)el.className=k===i&&!done?'on':(k<i||done?'done':'')});
  if(run){
    if(i!==last&&i>=0){last=i;beep(880,.18);beep(1175,.28,.16);buzz([120]);say(r.s[i][2].replace(/\d+ g/g,m=>W(parseInt(m))+' gram').replace('\u2014',','))}
    const n=i>=0&&r.s[i+1]?r.s[i+1][0]:r.end;
    const left=Math.ceil(n-e);
    if(!done&&left>=1&&left<=3&&cd!==left+'-'+n){cd=left+'-'+n;beep(600,.1)}
    if(!done&&i>=0&&r.s[i+1]&&left===5&&warned!==n){warned=n;say('Bersiap')}
    if(done){run=false;beep(660,.25);beep(880,.25,.25);beep(1320,.5,.5);buzz([200,100,200]);say('Selesai. Silakan dinikmati.');$('go').textContent='Mulai';rel()}
  }
}
function tick(){if(!run)return;acc=(performance.now()-t0)/1000;draw(acc);setTimeout(tick,100)}
async function wl(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
function rel(){try{lock&&lock.release()}catch(e){}lock=null}
function start(){if(acc>=r.end)reset();run=true;t0=performance.now()-acc*1000;$('go').textContent='Jeda';
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  wl();tick()}
function pause(){run=false;$('go').textContent='Lanjut';rel()}
function reset(){run=false;acc=0;last=-1;warned=-1;cd='';$('go').textContent='Mulai';rel();draw(0)}
$('go').onclick=()=>run?pause():start();
$('rs').onclick=reset;
$('dm').onclick=()=>{if(!run&&acc===0&&dose>8){dose--;build()}};
$('dp').onclick=()=>{if(!run&&acc===0&&dose<60){dose++;build()}};
document.addEventListener('visibilitychange',()=>{if(run&&document.visibilityState==='visible')wl()});
function openM(x){r=x;dose=x.dose;reset();build();$('home').hidden=true;$('prac').hidden=false;window.scrollTo(0,0)}
function showHome(){if(run)pause();reset();$('prac').hidden=true;$('home').hidden=false;window.scrollTo(0,0)}
$('back').onclick=showHome;
$('tsn').onclick=e=>{snd=!snd;const b=e.currentTarget;b.setAttribute('aria-pressed',snd);b.textContent='Bunyi: '+(snd?'hidup':'mati');if(snd)beep(880,.15)};
$('tvo').onclick=e=>{vo=!vo;const b=e.currentTarget;b.setAttribute('aria-pressed',vo);b.textContent='Suara pemandu: '+(vo?'hidup':'mati');if(vo)say('Suara pemandu hidup')};
$('hm').innerHTML=R.map((x,i)=>`<button class="mb" data-i="${i}"><b>${x.n}</b><span>${x.by}</span><em>${x.dose} g kopi · ${x.s[x.s.length-1][1]} g air · ${mmss(x.end)}</em></button>`).join('');
$('hm').onclick=e=>{const b=e.target.closest('.mb');if(b)openM(R[+b.dataset.i])};
build();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
